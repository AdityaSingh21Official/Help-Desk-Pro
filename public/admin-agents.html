<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agents · HelpDesk Pro</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Geist+Pixel&display=swap"
      rel="stylesheet"
    />
    <script src="./js/auth.js"></script>
  </head>
  <body
    class="bg-[#080809] text-white font-['Geist_Mono',monospace] antialiased"
  >
    <div class="flex min-h-screen flex-col lg:flex-row">
      <!-- Sidebar -->
      <aside
        class="w-full lg:w-64 shrink-0 bg-[#0b0b06] border-b lg:border-b-0 lg:border-r border-white/10 flex flex-col p-6 relative"
      >
        <div
          class="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.05)_1px,transparent_1px)] bg-[length:7px_7px] pointer-events-none"
        ></div>

        <div class="relative flex items-center gap-2.5 mb-8 lg:mb-10">
          <div
            class="w-8 h-8 bg-[#feff7c] text-[#434302] flex items-center justify-center font-['Geist_Pixel',sans-serif] text-sm"
          >
            HD
          </div>
          <span class="font-['Geist_Pixel',sans-serif] text-lg tracking-[-1px]"
            >HelpDesk Pro</span
          >
        </div>

        <nav
          class="relative flex flex-row lg:flex-col gap-1 text-xs uppercase tracking-[-0.2px] overflow-x-auto"
        >
          <a
            href="admin-dashboard.html"
            id="navDashboard"
            class="flex items-center gap-2.5 px-3 py-2.5 text-white/60 hover:bg-white/5 hover:text-white border-l-2 border-transparent transition-colors whitespace-nowrap"
            >Dashboard</a
          >
          <a
            href="admin-agents.html"
            id="navAgents"
            class="flex items-center gap-2.5 px-3 py-2.5 bg-[#feff7c]/10 text-white border-l-2 border-[#feff7c] whitespace-nowrap"
            >Agents</a
          >
          <a
            href="admin-organizations.html"
            id="navOrganizations"
            class="flex items-center gap-2.5 px-3 py-2.5 text-white/60 hover:bg-white/5 hover:text-white border-l-2 border-transparent transition-colors whitespace-nowrap"
            >Organizations</a
          >
          <a
            href="admin-api-keys.html"
            id="navApiKeys"
            class="flex items-center gap-2.5 px-3 py-2.5 text-white/60 hover:bg-white/5 hover:text-white border-l-2 border-transparent transition-colors whitespace-nowrap"
            >API Keys</a
          >
          <a
            href="agent-tickets.html"
            id="navAllTickets"
            class="flex items-center gap-2.5 px-3 py-2.5 text-white/60 hover:bg-white/5 hover:text-white border-l-2 border-transparent transition-colors whitespace-nowrap"
            >All Tickets</a
          >
        </nav>

        <div
          class="relative mt-6 lg:mt-auto pt-6 border-t border-white/10 flex items-center gap-3"
        >
          <div
            class="w-9 h-9 border border-[#feff7c]/40 bg-[#feff7c]/10 text-[#feff7c] flex items-center justify-center text-xs"
            id="userAvatar"
          >
            RM
          </div>
          <div class="text-sm leading-tight">
            <p id="adminName">Rita Mehta</p>
            <p class="text-white/40 text-[11px] uppercase mt-0.5">Admin</p>
          </div>
          <button
            id="logoutBtn"
            class="ml-auto text-white/40 hover:text-[#feff7c] text-[11px] uppercase underline underline-offset-4 cursor-pointer transition-colors"
          >
            Log out
          </button>
        </div>
      </aside>

      <!-- Main -->
      <main class="flex-1 p-6 sm:p-8 lg:p-10 min-w-0">
        <div class="mb-8">
          <p
            class="text-[11px] uppercase tracking-[-0.2px] text-[#feff7c] mb-2"
          >
            / Team
          </p>
          <h1
            class="font-['Geist_Pixel',sans-serif] text-3xl sm:text-4xl tracking-[-2px]"
          >
            Agents
          </h1>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8 items-start">
          <!-- Agents table -->
          <div
            class="xl:col-span-2 relative border border-white/10 bg-[#020203]"
          >
            <span
              class="absolute -top-px -left-px w-2.5 h-2.5 border-t border-l border-[#feff7c]"
            ></span>
            <span
              class="absolute -top-px -right-px w-2.5 h-2.5 border-t border-r border-[#feff7c]"
            ></span>
            <span
              class="absolute -bottom-px -left-px w-2.5 h-2.5 border-b border-l border-[#feff7c]"
            ></span>
            <span
              class="absolute -bottom-px -right-px w-2.5 h-2.5 border-b border-r border-[#feff7c]"
            ></span>

            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr
                    class="text-left text-[11px] uppercase tracking-[-0.2px] text-white/40 bg-[#080809] border-b border-white/10"
                  >
                    <th class="px-6 py-3.5 font-normal">/ Agent</th>
                    <th class="px-6 py-3.5 font-normal">/ Open workload</th>
                    <th class="px-6 py-3.5 font-normal">/ Status</th>
                    <th class="px-6 py-3.5 font-normal"></th>
                  </tr>
                </thead>
                <tbody
                  id="agentsTableBody"
                  class="divide-y divide-white/10"
                ></tbody>
              </table>
            </div>
          </div>

          <!-- Add agent form -->
          <div class="relative border border-white/10 bg-[#020203] p-6">
            <span
              class="absolute -top-px -left-px w-2.5 h-2.5 border-t border-l border-[#41412b]"
            ></span>
            <span
              class="absolute -top-px -right-px w-2.5 h-2.5 border-t border-r border-[#41412b]"
            ></span>
            <span
              class="absolute -bottom-px -left-px w-2.5 h-2.5 border-b border-l border-[#41412b]"
            ></span>
            <span
              class="absolute -bottom-px -right-px w-2.5 h-2.5 border-b border-r border-[#41412b]"
            ></span>

            <h2
              class="font-['Geist_Pixel',sans-serif] text-xl tracking-[-1px] mb-2"
            >
              Add an <span class="text-[#feff7c]">agent</span>
            </h2>
            <p class="text-white/60 text-xs leading-5 mb-6">
              / Agents don't self-register — you provision their account here.
            </p>

            <form id="addAgentForm" class="space-y-4">
              <div>
                <label
                  for="agentName"
                  class="block text-[11px] uppercase tracking-[-0.2px] text-white/60 mb-2"
                  >Full name</label
                >
                <input
                  type="text"
                  id="agentName"
                  name="agentName"
                  placeholder="Jane Doe"
                  class="w-full px-4 py-3 bg-[#080809] border border-white/10 text-sm text-white placeholder:text-white/30 font-['Geist_Mono',monospace] focus:outline-none focus:border-[#feff7c] focus:ring-1 focus:ring-[#feff7c]/40 transition-colors"
                  required
                />
              </div>
              <div>
                <label
                  for="agentEmail"
                  class="block text-[11px] uppercase tracking-[-0.2px] text-white/60 mb-2"
                  >Email</label
                >
                <input
                  type="email"
                  id="agentEmail"
                  name="agentEmail"
                  placeholder="jane@helpdesk.pro"
                  class="w-full px-4 py-3 bg-[#080809] border border-white/10 text-sm text-white placeholder:text-white/30 font-['Geist_Mono',monospace] focus:outline-none focus:border-[#feff7c] focus:ring-1 focus:ring-[#feff7c]/40 transition-colors"
                  required
                />
              </div>
              <div>
                <label
                  for="agentTempPassword"
                  class="block text-[11px] uppercase tracking-[-0.2px] text-white/60 mb-2"
                  >Temporary password - Auto Generated - Sent Via Email</label
                >
              </div>
              <button
                type="submit"
                id="addAgentBtn"
                class="w-full bg-[#feff7c] hover:bg-[#ffff47] text-[#434302] text-sm font-medium uppercase tracking-[-0.5px] py-3.5 transition-colors cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
              >
                Add agent
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
    <div
      id="toast"
      class="fixed -top-28 left-1/2 -translate-x-1/2 bg-[#feff7c] text-[#434302] border border-[#434302]/30 px-6 py-3 text-sm font-medium uppercase tracking-[-0.5px] font-['Geist_Mono',monospace] shadow-[0_4px_10px_rgba(0,0,0,0.4)] transition-[top] duration-400 ease-out z-[1001]"
    ></div>
  </body>
  <script type="module" src="./js/admin-agents.js"></script>
  <script type="module" src="./js/utils.js"></script>
</html>
