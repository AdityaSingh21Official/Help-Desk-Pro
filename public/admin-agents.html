<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agents · craftkel.ai</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface: #e0e0e0;
        --ink: #555555;
        --ink-strong: #3d3d3d;
        --muted: #6f6f6f;
        --blue: #4f86c6;
        --blue-ink: #3f74b3;
        --red: #d4605a;
        --amber: #9a6a1f;
        --light: rgba(255, 255, 255, 0.92);
        --dark: rgba(150, 150, 150, 0.5);

        --raised: 9px 9px 18px var(--dark), -9px -9px 18px var(--light);
        --raised-sm: 5px 5px 10px var(--dark), -5px -5px 10px var(--light);
        --raised-xs: 3px 3px 6px var(--dark), -3px -3px 6px var(--light);
        --inset:
          inset 6px 6px 12px var(--dark), inset -6px -6px 12px var(--light);
        --inset-sm:
          inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light);
      }

      body {
        background: var(--surface);
        color: var(--ink);
        font-family: "Montserrat", system-ui, sans-serif;
        min-height: 100vh;
      }

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }

      /* ---------- Sidebar ---------- */
      .sidebar {
        background: var(--surface);
        border-radius: 36px;
        box-shadow: var(--raised);
      }
      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--blue);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        box-shadow: var(--raised-xs);
      }
      .nav-item {
        display: flex;
        align-items: center;
        padding: 12px 20px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        transition:
          box-shadow 160ms ease,
          color 160ms ease;
      }
      .nav-item:hover {
        box-shadow: var(--raised-xs);
        color: var(--ink-strong);
      }
      .nav-item:active {
        box-shadow: var(--inset-sm);
      }
      .nav-item.is-active {
        background: var(--blue);
        color: #fff;
        box-shadow: var(--raised-sm);
      }
      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--blue-ink);
        background: var(--surface);
        box-shadow: var(--raised-sm);
      }

      /* ---------- Buttons ---------- */
      .btn-soft {
        padding: 8px 16px;
        border: 0;
        border-radius: 9999px;
        background: var(--surface);
        color: var(--ink);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: var(--raised-xs);
        transition:
          box-shadow 160ms ease,
          color 160ms ease;
      }
      .btn-soft:hover {
        color: var(--blue-ink);
      }
      .btn-soft:active {
        box-shadow: var(--inset-sm);
      }
      .btn-primary {
        display: block;
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 9999px;
        background: var(--blue);
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--raised-sm);
        transition:
          box-shadow 160ms ease,
          background 160ms ease;
      }
      .btn-primary:hover {
        background: var(--blue-ink);
      }
      .btn-primary:active {
        box-shadow: var(--inset-sm);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* ---------- Panels ---------- */
      .panel {
        border-radius: 32px;
        background: var(--surface);
        box-shadow: var(--raised);
      }

      /* ---------- Table ---------- */
      .table-wrap {
        margin: 0 14px;
        overflow-x: auto;
      }
      .data-table {
        width: 100%;
        min-width: 560px;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 14px;
      }
      .data-table thead th {
        padding: 14px 18px;
        text-align: left;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        background: var(--surface);
        box-shadow: var(--inset-sm);
      }
      .data-table thead th:first-child {
        border-radius: 9999px 0 0 9999px;
        padding-left: 26px;
      }
      .data-table thead th:last-child {
        border-radius: 0 9999px 9999px 0;
      }
      .data-table tbody td {
        padding: 18px;
        color: var(--ink);
        vertical-align: middle;
      }
      .data-table tbody td:first-child {
        padding-left: 26px;
        font-weight: 500;
        color: var(--ink-strong);
      }
      .data-table tbody tr + tr td {
        box-shadow:
          0 -1px 0 rgba(150, 150, 150, 0.28),
          0 -2px 0 var(--light);
      }

      /* Fallbacks so rows injected by admin-agents.js with the old
         dark-theme utility classes still read correctly. */
      #agentsTableBody * {
        text-transform: none;
        letter-spacing: normal;
      }
      #agentsTableBody [class*="text-white"] {
        color: var(--ink);
      }
      #agentsTableBody [class*="text-white/4"],
      #agentsTableBody [class*="text-white/3"],
      #agentsTableBody [class*="text-white/5"] {
        color: var(--muted);
      }

      /* Status badges */
      #agentsTableBody span[class*="border"],
      #agentsTableBody span[class*="bg-"],
      #agentsTableBody .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 0;
        border-radius: 9999px;
        background: var(--surface);
        color: var(--ink-strong);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        box-shadow: var(--raised-xs);
      }
      #agentsTableBody span[class*="feff7c"],
      #agentsTableBody span[class*="green"],
      #agentsTableBody span[class*="emerald"],
      #agentsTableBody .status-active {
        background: var(--blue);
        color: #fff;
        box-shadow: var(--raised-xs);
      }
      #agentsTableBody span[class*="red"],
      #agentsTableBody span[class*="ff6b6b"],
      #agentsTableBody .status-inactive {
        background: var(--surface);
        color: var(--red);
        box-shadow: var(--inset-sm);
      }
      /* Status dot: small circle in the badge's text colour */
      #agentsTableBody span[class] > span,
      #agentsTableBody span > span[class],
      #agentsTableBody .status-pill > span {
        display: inline-block;
        flex-shrink: 0;
        width: 7px;
        height: 7px;
        min-width: 7px;
        padding: 0;
        margin: 0;
        border: 0;
        border-radius: 50%;
        background: currentColor;
        box-shadow: none;
      }
      #agentsTableBody [class*="text-[#feff7c]"],
      #agentsTableBody [class*="text-green"],
      #agentsTableBody [class*="text-emerald"] {
        color: var(--blue-ink);
      }
      #agentsTableBody [class*="text-red"],
      #agentsTableBody [class*="text-[#ff6b6b]"] {
        color: var(--red);
      }

      /* Row actions (edit, deactivate, remove...) */
      #agentsTableBody button {
        padding: 8px 18px;
        border: 0;
        border-radius: 9999px;
        background: var(--surface);
        color: var(--ink);
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        box-shadow: var(--raised-xs);
        transition: box-shadow 160ms ease;
      }
      #agentsTableBody button:hover {
        color: var(--blue-ink);
        background: var(--surface);
      }
      #agentsTableBody button:active {
        box-shadow: var(--inset-sm);
      }
      #agentsTableBody button:disabled {
        color: var(--muted);
        box-shadow: var(--inset-sm);
        cursor: not-allowed;
      }

      /* ---------- Form ---------- */
      .field-label {
        display: block;
        margin-bottom: 10px;
        padding-left: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      .field {
        width: 100%;
        padding: 14px 20px;
        border: 0;
        border-radius: 9999px;
        background: var(--surface);
        color: var(--ink-strong);
        font-family: inherit;
        font-size: 14px;
        box-shadow: var(--inset-sm);
      }
      .field::placeholder {
        color: #9a9a9a;
      }
      .note {
        padding: 14px 20px;
        border-radius: 22px;
        font-size: 13px;
        line-height: 20px;
        color: var(--muted);
        box-shadow: var(--inset-sm);
      }

      /* ---------- Toast ---------- */
      #toast {
        background: var(--surface);
        color: var(--blue-ink);
        border-radius: 9999px;
        padding: 14px 28px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: var(--raised);
      }

      @media (max-width: 639px) {
        .sidebar {
          border-radius: 28px;
        }
        .table-wrap {
          margin: 0 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .nav-item,
        .btn-soft,
        .btn-primary {
          transition: none;
        }
      }
    </style>
    <script src="./js/auth.js"></script>
  </head>
  <body class="antialiased">
    <div class="flex min-h-screen flex-col lg:flex-row gap-6 p-4 sm:p-6 lg:p-8">
      <!-- Sidebar -->
      <aside
        class="sidebar w-full lg:w-64 shrink-0 flex flex-col p-6 lg:sticky lg:top-8 lg:self-start lg:min-h-[calc(100vh-4rem)]"
      >
        <div class="flex items-center gap-3 mb-8 lg:mb-10">
          <div class="brand-mark">CK</div>
          <span
            class="text-[17px] font-semibold tracking-[-0.4px] text-[#3d3d3d]"
            >craftkel.ai</span
          >
        </div>

        <nav
          class="flex flex-row lg:flex-col gap-2 overflow-x-auto pb-2 lg:pb-0"
        >
          <a href="admin-dashboard.html" id="navDashboard" class="nav-item"
            >Dashboard</a
          >
          <a
            href="admin-agents.html"
            id="navAgents"
            aria-current="page"
            class="nav-item is-active"
            >Agents</a
          >
          <a
            href="admin-organizations.html"
            id="navOrganizations"
            class="nav-item"
            >Organizations</a
          >
          <a href="admin-api-keys.html" id="navApiKeys" class="nav-item"
            >API Keys</a
          >
          <a href="agent-tickets.html" id="navAllTickets" class="nav-item"
            >All Tickets</a
          >
        </nav>

        <div class="mt-6 lg:mt-auto pt-6 flex items-center gap-3">
          <div class="avatar" id="userAvatar">RM</div>
          <div class="min-w-0 leading-tight">
            <p
              id="adminName"
              class="text-sm font-medium text-[#3d3d3d] truncate"
            >
              Rita Mehta
            </p>
            <p class="text-[12px] text-[#6f6f6f] mt-0.5">Admin</p>
          </div>
          <button id="logoutBtn" type="button" class="btn-soft ml-auto">
            Log out
          </button>
        </div>
      </aside>

      <!-- Main -->
      <main class="flex-1 min-w-0 py-2 lg:py-4 lg:pr-2">
        <div class="mb-10">
          <p class="text-[13px] font-medium text-[#6f6f6f] mb-2">Team</p>
          <h1
            class="text-3xl sm:text-4xl tracking-[-1.2px] text-[#3d3d3d] leading-tight font-semibold"
          >
            Agents
          </h1>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8 items-start">
          <!-- Agents table -->
          <section class="panel xl:col-span-2 pb-4 pt-4 min-w-0">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Agent</th>
                    <th>Open workload</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="agentsTableBody"></tbody>
              </table>
            </div>
          </section>

          <!-- Add agent form -->
          <section class="panel p-8">
            <h2
              class="text-xl tracking-[-0.5px] text-[#3d3d3d] mb-2 font-semibold"
            >
              Add an agent
            </h2>
            <p class="text-[13px] leading-5 text-[#6f6f6f] mb-8">
              Agents don't self-register. You provision their account here.
            </p>

            <form id="addAgentForm" class="space-y-6">
              <div>
                <label for="agentName" class="field-label">Full name</label>
                <input
                  type="text"
                  id="agentName"
                  name="agentName"
                  placeholder="Jane Doe"
                  class="field"
                  required
                />
              </div>
              <div>
                <label for="agentEmail" class="field-label">Email</label>
                <input
                  type="email"
                  id="agentEmail"
                  name="agentEmail"
                  placeholder="jane@craftkel.ai"
                  class="field"
                  required
                />
              </div>
              <div>
                <p id="agentTempPassword" class="note">
                  Temporary password is auto-generated and sent to the agent by
                  email.
                </p>
              </div>
              <button type="submit" id="addAgentBtn" class="btn-primary">
                Add agent
              </button>
            </form>
          </section>
        </div>
      </main>
    </div>

    <div
      id="toast"
      class="fixed -top-28 left-1/2 -translate-x-1/2 transition-[top] duration-400 ease-out z-[1001]"
    ></div>
  </body>
  <script type="module" src="./js/admin-agents.js"></script>
  <script type="module" src="./js/utils.js"></script>
</html>
