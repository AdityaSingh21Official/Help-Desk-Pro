<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Ticket · craftkel.ai</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --raised:
          9px 9px 18px rgba(150, 150, 150, 0.5),
          -9px -9px 18px rgba(255, 255, 255, 0.92);
        --raised-sm:
          5px 5px 10px rgba(150, 150, 150, 0.5),
          -5px -5px 10px rgba(255, 255, 255, 0.92);
        --raised-xs:
          3px 3px 6px rgba(150, 150, 150, 0.5),
          -3px -3px 6px rgba(255, 255, 255, 0.92);
        --inset-sm:
          inset 3px 3px 6px rgba(150, 150, 150, 0.5),
          inset -3px -3px 6px rgba(255, 255, 255, 0.92);
      }
    </style>
  </head>
  <body
    class="antialiased min-h-screen bg-[#e0e0e0] text-[#555] font-['Montserrat',system-ui,sans-serif]"
  >
    <div
      class="w-full max-w-6xl mx-auto px-4 pt-4 pb-14 sm:px-8 sm:pt-6 sm:pb-[72px]"
    >
      <!-- Top bar -->
      <header
        class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3 rounded-[32px] bg-[#e0e0e0] py-3 pl-5 pr-4 [box-shadow:var(--raised)]"
      >
        <div class="flex items-center gap-3">
          <span
            class="w-10 h-10 rounded-full bg-[#4f86c6] text-white flex items-center justify-center text-[13px] font-semibold [box-shadow:var(--raised-xs)]"
            >CK</span
          >
          <span
            class="text-[17px] font-semibold tracking-[-0.4px] text-[#3d3d3d]"
            >craftkel.ai</span
          >
        </div>

        <nav
          aria-label="Main"
          class="order-3 w-full flex items-center gap-1.5 overflow-x-auto px-1 pt-1 pb-2 md:order-none md:w-auto md:overflow-visible md:p-0"
        >
          <a
            href="customer-tickets.html"
            id="navMyTickets"
            class="flex items-center whitespace-nowrap rounded-full px-5 py-2.5 text-sm font-medium text-[#555] transition-[box-shadow,color] duration-150 hover:text-[#3d3d3d] hover:[box-shadow:var(--raised-xs)] active:[box-shadow:var(--inset-sm)]"
            >My Tickets</a
          >
          <a
            href="new-ticket.html"
            id="navNewTicket"
            aria-current="page"
            class="flex items-center whitespace-nowrap rounded-full bg-[#4f86c6] px-5 py-2.5 text-sm font-medium text-white [box-shadow:var(--raised-sm)]"
            >New Ticket</a
          >
          <a
            href="customer-api-keys.html"
            id="navMyApiKeys"
            class="flex items-center whitespace-nowrap rounded-full px-5 py-2.5 text-sm font-medium text-[#555] transition-[box-shadow,color] duration-150 hover:text-[#3d3d3d] hover:[box-shadow:var(--raised-xs)] active:[box-shadow:var(--inset-sm)]"
            >API Keys</a
          >
        </nav>

        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 shrink-0 rounded-full bg-[#e0e0e0] text-[#3f74b3] flex items-center justify-center text-xs font-semibold [box-shadow:var(--raised-sm)]"
          >
            SV
          </div>
          <p
            id="customerName"
            class="hidden sm:block text-sm font-medium text-[#3d3d3d]"
          >
            Sana Vora
          </p>
          <button
            id="logoutBtn"
            type="button"
            class="cursor-pointer rounded-full bg-[#e0e0e0] px-4 py-2 text-xs font-medium text-[#555] transition-[box-shadow,color] duration-150 [box-shadow:var(--raised-xs)] hover:text-[#3f74b3] active:[box-shadow:var(--inset-sm)]"
          >
            Log out
          </button>
        </div>
      </header>

      <main>
        <!-- Heading -->
        <div class="mt-14 mb-10">
          <h1
            class="text-[clamp(34px,5.5vw,56px)] leading-[1.08] tracking-[-2px] font-normal text-[#3d3d3d]"
          >
            Open a
            <b class="block font-semibold">new ticket.</b>
          </h1>
          <p
            class="mt-6 max-w-[460px] text-[15px] leading-[1.8] text-[#6f6f6f]"
          >
            Tell us what's going wrong and we'll route it to the right agent.
          </p>
        </div>

        <!-- Form -->
        <form
          id="newTicketForm"
          class="flex max-w-[760px] flex-col gap-7 rounded-[32px] bg-[#e0e0e0] p-7 sm:p-10 [box-shadow:var(--raised)]"
        >
          <div>
            <label
              for="ticketSubject"
              class="block mb-2.5 pl-1.5 text-[13px] font-medium text-[#6f6f6f]"
              >Subject</label
            >
            <input
              type="text"
              id="ticketSubject"
              name="ticketSubject"
              placeholder="Brief summary of the issue"
              required
              class="w-full rounded-full border-0 bg-[#e0e0e0] px-5 py-3.5 text-sm text-[#3d3d3d] placeholder:text-[#9a9a9a] [box-shadow:var(--inset-sm)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-[#4f86c6]"
            />
          </div>

          <div>
            <label
              for="ticketDescription"
              class="block mb-2.5 pl-1.5 text-[13px] font-medium text-[#6f6f6f]"
              >Description</label
            >
            <textarea
              id="ticketDescription"
              name="ticketDescription"
              rows="6"
              placeholder="What happened? Steps to reproduce, if any."
              required
              class="w-full resize-none rounded-3xl border-0 bg-[#e0e0e0] px-5 py-3.5 text-sm leading-[1.7] text-[#3d3d3d] placeholder:text-[#9a9a9a] [box-shadow:var(--inset-sm)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-[#4f86c6]"
            ></textarea>
          </div>

          <fieldset class="m-0 min-w-0 border-0 p-0">
            <legend
              class="block mb-2.5 pl-1.5 text-[13px] font-medium text-[#6f6f6f]"
            >
              Priority
            </legend>
            <div
              id="prioritySelector"
              class="grid grid-cols-2 gap-3.5 p-1 sm:grid-cols-4"
            >
              <label class="block cursor-pointer">
                <input
                  type="radio"
                  name="priority"
                  value="low"
                  class="peer sr-only"
                />
                <span
                  class="flex items-center justify-center gap-2 rounded-full bg-[#e0e0e0] px-3.5 py-3 text-[13px] font-medium text-[#555] transition-[box-shadow,color] duration-150 [box-shadow:var(--raised-xs)] hover:text-[#3d3d3d] peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-[3px] peer-focus-visible:outline-[#4f86c6] peer-checked:font-semibold peer-checked:text-[#6f6f6f] peer-checked:[box-shadow:var(--inset-sm)]"
                >
                  <span
                    class="h-[7px] w-[7px] rounded-full bg-[#9a9a9a]"
                  ></span>
                  Low
                </span>
              </label>

              <label class="block cursor-pointer">
                <input
                  type="radio"
                  name="priority"
                  value="medium"
                  class="peer sr-only"
                  checked
                />
                <span
                  class="flex items-center justify-center gap-2 rounded-full bg-[#e0e0e0] px-3.5 py-3 text-[13px] font-medium text-[#555] transition-[box-shadow,color] duration-150 [box-shadow:var(--raised-xs)] hover:text-[#3d3d3d] peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-[3px] peer-focus-visible:outline-[#4f86c6] peer-checked:font-semibold peer-checked:text-[#3f74b3] peer-checked:[box-shadow:var(--inset-sm)]"
                >
                  <span
                    class="h-[7px] w-[7px] rounded-full bg-[#4f86c6]"
                  ></span>
                  Medium
                </span>
              </label>

              <label class="block cursor-pointer">
                <input
                  type="radio"
                  name="priority"
                  value="high"
                  class="peer sr-only"
                />
                <span
                  class="flex items-center justify-center gap-2 rounded-full bg-[#e0e0e0] px-3.5 py-3 text-[13px] font-medium text-[#555] transition-[box-shadow,color] duration-150 [box-shadow:var(--raised-xs)] hover:text-[#3d3d3d] peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-[3px] peer-focus-visible:outline-[#4f86c6] peer-checked:font-semibold peer-checked:text-[#9a6a1f] peer-checked:[box-shadow:var(--inset-sm)]"
                >
                  <span
                    class="h-[7px] w-[7px] rounded-full bg-[#d9973b]"
                  ></span>
                  High
                </span>
              </label>

              <label class="block cursor-pointer">
                <input
                  type="radio"
                  name="priority"
                  value="critical"
                  class="peer sr-only"
                />
                <span
                  class="flex items-center justify-center gap-2 rounded-full bg-[#e0e0e0] px-3.5 py-3 text-[13px] font-medium text-[#555] transition-[box-shadow,color] duration-150 [box-shadow:var(--raised-xs)] hover:text-[#3d3d3d] peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-[3px] peer-focus-visible:outline-[#4f86c6] peer-checked:font-semibold peer-checked:text-[#d4605a] peer-checked:[box-shadow:var(--inset-sm)]"
                >
                  <span
                    class="h-[7px] w-[7px] rounded-full bg-[#d4605a]"
                  ></span>
                  Critical
                </span>
              </label>
            </div>
          </fieldset>

          <div class="flex flex-wrap items-center gap-4 pt-1">
            <button
              type="submit"
              id="submitTicketBtn"
              class="inline-flex cursor-pointer items-center justify-center whitespace-nowrap rounded-full border-0 bg-[#4f86c6] px-7 py-3.5 text-sm font-semibold text-white transition-[box-shadow,background] duration-150 [box-shadow:var(--raised-sm)] hover:bg-[#3f74b3] active:[box-shadow:var(--inset-sm)] disabled:cursor-not-allowed disabled:opacity-60"
            >
              Submit ticket
            </button>
            <a
              href="customer-tickets.html"
              id="cancelTicketBtn"
              class="inline-flex items-center justify-center rounded-full bg-[#e0e0e0] px-6 py-3.5 text-sm font-medium text-[#555] transition-[box-shadow,color] duration-150 [box-shadow:var(--raised-xs)] hover:text-[#3f74b3] active:[box-shadow:var(--inset-sm)]"
              >Cancel</a
            >
          </div>
        </form>
      </main>
    </div>
  </body>
  <script type="module" src="./js/utils.js"></script>
</html>
