<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Ticket · HelpDesk Pro</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-surface text-ink">
    <div class="flex min-h-screen">
      <aside class="w-64 shrink-0 bg-panel text-white flex flex-col p-6">
        <div class="flex items-center gap-2.5 mb-10">
          <div
            class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center font-mono font-bold text-sm"
          >
            HD
          </div>
          <span class="font-display font-semibold text-lg">HelpDesk Pro</span>
        </div>
        <nav class="flex flex-col gap-1 text-sm">
          <a
            href="customer-tickets.html"
            id="navMyTickets"
            class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-white/60 hover:bg-white/5 hover:text-white border-l-2 border-transparent"
            >My Tickets</a
          >
          <a
            href="new-ticket.html"
            id="navNewTicket"
            class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg bg-brand/15 text-white border-l-2 border-brand font-medium"
            >New Ticket</a
          >
        </nav>
        <div
          class="mt-auto pt-6 border-t border-panelline flex items-center gap-3"
        >
          <div
            class="w-9 h-9 rounded-full bg-brand/20 text-brand flex items-center justify-center text-xs font-semibold"
          >
            SV
          </div>
          <div class="text-sm leading-tight">
            <p id="customerName">Sana Vora</p>
            <p class="text-white/40 text-xs uppercase tracking-wide">
              Customer
            </p>
          </div>
          <button
            id="logoutBtn"
            class="ml-auto text-white/40 hover:text-white text-xs underline"
          >
            Log out
          </button>
        </div>
      </aside>

      <main class="flex-1 p-10 flex justify-center">
        <div class="w-full max-w-2xl">
          <div class="mb-8">
            <p
              class="font-mono text-xs uppercase tracking-widest text-brand mb-1"
            >
              Support
            </p>
            <h1 class="font-display text-3xl font-semibold">
              Open a new ticket
            </h1>
            <p class="text-inksoft text-sm mt-1">
              Tell us what's going wrong — we'll route it to the right agent.
            </p>
          </div>

          <form
            id="newTicketForm"
            class="bg-white border border-black/5 rounded-2xl p-8 space-y-6"
          >
            <div>
              <label
                for="ticketSubject"
                class="block text-sm font-semibold mb-1.5"
                >Subject</label
              >
              <input
                type="text"
                id="ticketSubject"
                name="ticketSubject"
                placeholder="Brief summary of the issue"
                class="w-full px-4 py-2.5 rounded-lg border border-black/10 text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand"
                required
              />
            </div>

            <div>
              <label
                for="ticketDescription"
                class="block text-sm font-semibold mb-1.5"
                >Description</label
              >
              <textarea
                id="ticketDescription"
                name="ticketDescription"
                rows="6"
                placeholder="What happened? Steps to reproduce, if any."
                class="w-full px-4 py-2.5 rounded-lg border border-black/10 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand"
                required
              ></textarea>
            </div>

            <div>
              <label class="block text-sm font-semibold mb-2">Priority</label>
              <div id="prioritySelector" class="grid grid-cols-4 gap-3">
                <label class="priority-option cursor-pointer">
                  <input
                    type="radio"
                    name="priority"
                    value="low"
                    class="peer sr-only"
                  />
                  <div
                    class="text-center px-3 py-2.5 rounded-lg border border-black/10 text-sm font-medium text-inksoft peer-checked:border-inksoft peer-checked:bg-black/5 peer-checked:text-ink transition-colors"
                  >
                    Low
                  </div>
                </label>
                <label class="priority-option cursor-pointer">
                  <input
                    type="radio"
                    name="priority"
                    value="medium"
                    class="peer sr-only"
                    checked
                  />
                  <div
                    class="text-center px-3 py-2.5 rounded-lg border border-black/10 text-sm font-medium text-inksoft peer-checked:border-brand peer-checked:bg-brand/10 peer-checked:text-brand-dark transition-colors"
                  >
                    Medium
                  </div>
                </label>
                <label class="priority-option cursor-pointer">
                  <input
                    type="radio"
                    name="priority"
                    value="high"
                    class="peer sr-only"
                  />
                  <div
                    class="text-center px-3 py-2.5 rounded-lg border border-black/10 text-sm font-medium text-inksoft peer-checked:border-[#C77C11] peer-checked:bg-[#FCEFD9] peer-checked:text-[#C77C11] transition-colors"
                  >
                    High
                  </div>
                </label>
                <label class="priority-option cursor-pointer">
                  <input
                    type="radio"
                    name="priority"
                    value="critical"
                    class="peer sr-only"
                  />
                  <div
                    class="text-center px-3 py-2.5 rounded-lg border border-black/10 text-sm font-medium text-inksoft peer-checked:border-[#C4453B] peer-checked:bg-[#FBE8E6] peer-checked:text-[#C4453B] transition-colors"
                  >
                    Critical
                  </div>
                </label>
              </div>
            </div>

            <div class="flex items-center gap-3 pt-2">
              <button
                type="submit"
                id="submitTicketBtn"
                class="bg-brand hover:bg-brand-dark text-white text-sm font-semibold px-6 py-2.5 rounded-lg transition-colors"
              >
                Submit ticket
              </button>
              <a
                href="customer-tickets.html"
                id="cancelTicketBtn"
                class="text-sm font-medium text-inksoft hover:text-ink px-4 py-2.5"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
